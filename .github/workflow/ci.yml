name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12" ]
        exclude:
          - os: macos-latest
            python-version: "3.8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install optional dependencies
        run: |
          python -m pip install "psutil>=5.9.0"
          python -m pip install flake8 pylint pytest

      - name: Syntax check (compileall)
        run: python -m compileall -q scanner.py

      - name: Flake8 (critical errors only)
        run: |
          python -m flake8 scanner.py --select=E9,F63,F7,F82,F401,F811,F841 --show-source --statistics

      - name: Pylint (non-blocking)
        continue-on-error: true
        run: |
          python -m pylint scanner.py --disable=all --enable=E,unused-import,unused-variable,undefined-variable --score=no

      - name: CLI smoke test (help)
        run: python scanner.py --help

      - name: Functional smoke test
        shell: bash
        run: |
          set -e
          printf 'https://mail.gmail.com:john@gmail.com:Pass123\nhttps://example.com:user:pass\n' > sample.ulp
          python scanner.py -f sample.ulp -m 1 -p "gmail" --no-write -q
          python scanner.py -f sample.ulp -m 2 -p ".com" --no-write -q --no-log
          python scanner.py -f sample.ulp -m 1 -p "gmail" -o out.txt --no-log
          test -f out.txt
          grep -q "gmail" out.txt

      - name: Run pytest (if tests exist)
        shell: bash
        run: |
          if [ -d tests ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            python -m pytest -q
          else
            echo "No tests/ directory yet - skipping pytest."
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Bandit scan
        continue-on-error: true
        run: |
          bandit -r scanner.py -ll -f txt

      - name: Dependency audit
        continue-on-error: true
        run: |
          python -m pip install -r requirements.txt
          pip-audit
